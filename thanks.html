<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You! - Ninja Code Pro</title>
  <style>
    body {
      background-color: #090b10;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #12151e;
      border: 1px solid #262b38;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 450px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h1 { color: #10b981; font-size: 22px; margin-bottom: 10px; }
    p { color: #94a3b8; font-size: 13.5px; line-height: 1.5; margin-bottom: 20px; }
    .license-box {
      background: #181c26;
      border: 1px solid #10b981;
      color: #10b981;
      font-family: monospace;
      font-size: 16px;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      letter-spacing: 1px;
      word-break: break-all;
    }
    .btn {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 10px 20px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { opacity: 0.9; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="card">
    <h1>🎉 Successful Payment!</h1>
    <p>Thank you for subscribing to <b>Ninja Code Pro</b>. Your official license key has been generated:</p>
    
    <div class="license-box" id="license-display">Loading license...</div>
    
    <button class="btn" onclick="copyLicense()">📋 Copy Key</button>
    <p style="font-size: 11px; margin-top: 20px; color: #64748b;">Paste this key into the extension to activate your account immediately.</p>
  </div>

  <script>
    // Tus credenciales oficiales de Supabase
    const SUPABASE_URL = 'https://cukpjfcvewjiqqpnnkks.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_bWzhO_n6s0CDWv7EVIc84w_y6sLnBqU';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function initLicenseProcess() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id') || 'direct_visit_' + Date.now();

        const storageKey = `ninja_license_${sessionId}`;
        let existingKey = localStorage.getItem(storageKey);

        if (existingKey) {
          document.getElementById("license-display").textContent = existingKey;
          return;
        }

        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
        let segment = () => Array.from({length: 4}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
        const uniqueKey = `NINJA-${segment()}-${segment()}-${segment()}`;

        document.getElementById("license-display").textContent = uniqueKey;
        localStorage.setItem(storageKey, uniqueKey);

        const expiresAt = Date.now() + (30 * 24 * 60 * 60 * 1000); // 30 días
        const { error } = await supabaseClient
          .from('nsc_licenses')
          .insert([
            { 
              license_key: uniqueKey, 
              user_name: `Stripe User (${sessionId.slice(-6)})`, 
              plan_type: 'pro', 
              status: 'active', 
              expires_at: expiresAt, 
              max_uses: 5, 
              current_uses: 0 
            }
          ]);

        if (error) {
          console.error("Error saving license to database:", error);
        }
      } catch (err) {
        console.error("Error:", err);
        document.getElementById("license-display").textContent = "NINJA-ERROR-CONTACT-SUPPORT";
      }
    }

    function copyLicense() {
      const text = document.getElementById("license-display").textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("Key copied to clipboard!");
      });
    }

    initLicenseProcess();
  </script>
</body>
</html>
